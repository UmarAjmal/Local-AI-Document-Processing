<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Document Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

        body { 
            display: flex; height: 100vh; 
            background: linear-gradient(135deg, #1e1e24, #131417, #1a1a2e); 
            color: #ececf1; 
            overflow: hidden;
        }
        
        /* Glassmorphism Sidebar */
        .sidebar { 
            width: 260px; 
            background: rgba(32, 33, 35, 0.3); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            border-right: 1px solid rgba(255, 255, 255, 0.05); 
            padding: 15px; display: flex; flex-direction: column; 
            z-index: 2;
        }
        .upload-btn { 
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0)); 
            border: 1px solid rgba(255,255,255,0.1); 
            color: white; border-radius: 10px; padding: 12px; cursor: pointer; text-align: left; 
            display: flex; align-items: center; gap: 10px; 
            transition: all 0.3s ease; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .upload-btn:hover { 
            background: rgba(255,255,255,0.1); 
            box-shadow: 0 4px 20px rgba(16, 163, 127, 0.3); 
            border-color: rgba(16, 163, 127, 0.5);
        }
        .doc-list { margin-top: 20px; overflow-y: auto; flex: 1; }
        .doc-item { padding: 12px; font-size: 14px; color: #ececf1; margin-bottom: 8px; border-radius: 8px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: 0.2s; background: rgba(255,255,255,0.02); border: 1px solid transparent; }
        .doc-item:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.1); }

        /* Main Chat Area */
        .main-chat { flex: 1; display: flex; flex-direction: column; position: relative; background: radial-gradient(circle at center, rgba(52, 53, 65, 0.2) 0%, rgba(0,0,0,0) 100%); }
        .chat-history { flex: 1; overflow-y: auto; padding-bottom: 120px; }
        .message { padding: 24px 20%; display: flex; gap: 20px; border-bottom: 1px solid transparent; font-size: 15px; line-height: 1.6; transition: background 0.3s ease; }
        .message.ai { background: rgba(255,255,255,0.02); border-bottom: 1px solid rgba(255,255,255,0.05); border-top: 1px solid rgba(255,255,255,0.05); }
        .message-content { white-space: pre-wrap; flex: 1; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
        .avatar { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .user .avatar { background: linear-gradient(135deg, #10a37f, #0b7359); }
        .ai .avatar { background: linear-gradient(135deg, #19c37d, #149c63); }

        /* Input Area - Glassmorphism */
        .input-container { position: absolute; bottom: 0; left: 0; width: 100%; padding: 30px 20%; background: linear-gradient(180deg, rgba(26, 26, 46, 0), rgba(20, 20, 30, 0.9) 70%, rgba(20, 20, 30, 1)); }
        .input-box { 
            display: flex; 
            background: rgba(64, 65, 79, 0.4); 
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15); 
            border-radius: 16px; padding: 12px 20px; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1); 
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .input-box:focus-within {
            border-color: rgba(16, 163, 127, 0.5);
            box-shadow: 0 8px 32px rgba(16, 163, 127, 0.15), inset 0 1px 0 rgba(255,255,255,0.1);
        }
        .input-box input { flex: 1; background: transparent; border: none; color: white; font-size: 16px; outline: none; }
        .input-box input::placeholder { color: rgba(255,255,255,0.5); }
        .input-box button { background: none; border: none; color: rgba(255,255,255,0.5); cursor: pointer; padding: 5px; display: flex; align-items: center; transition: all 0.3s ease; }
        .input-box button:hover { color: #10a37f; transform: scale(1.1); filter: drop-shadow(0 0 5px rgba(16,163,127,0.8)); }

        /* Modal - Glassmorphism */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 100; }
        .modal { 
            background: rgba(32, 33, 35, 0.7); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border-radius: 16px; width: 500px; padding: 30px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1); 
            border: 1px solid rgba(255,255,255,0.1); 
        }
        .modal h2 { margin-bottom: 20px; font-size: 20px; font-weight: 600; text-align: center; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .drop-zone { 
            background: rgba(255,255,255,0.02);
            border: 2px dashed rgba(255,255,255,0.2); 
            border-radius: 12px; padding: 40px; text-align: center; color: #ececf1; 
            transition: all 0.3s ease; 
        }
        .drop-zone.dragover { border-color: #10a37f; background: rgba(16, 163, 127, 0.1); box-shadow: inset 0 0 20px rgba(16, 163, 127, 0.2); }
        .browse-link { color: #10a37f; cursor: pointer; text-decoration: none; font-weight: bold; transition: text-shadow 0.2s; }
        .browse-link:hover { text-shadow: 0 0 8px rgba(16, 163, 127, 0.6); }
        
        .staged-list { margin-top: 15px; max-height: 150px; overflow-y: auto; list-style: none; padding-right: 5px; }
        .staged-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.05); margin-bottom: 8px; border-radius: 8px; font-size: 14px; transition: 0.2s; }
        .staged-item:hover { background: rgba(0,0,0,0.4); border-color: rgba(255,255,255,0.1); }
        .staged-item button { background: none; border: none; color: #ff4a4a; cursor: pointer; font-size: 16px; transition: transform 0.2s; }
        .staged-item button:hover { transform: scale(1.2); filter: drop-shadow(0 0 5px rgba(255,74,74,0.6)); }
        
        .modal-actions { display: flex; justify-content: space-between; gap: 15px; margin-top: 25px; }
        .modal-actions button { flex: 1; padding: 12px; border-radius: 10px; border: none; cursor: pointer; font-size: 14px; font-weight: bold; transition: all 0.3s ease; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .btn-cancel { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.05); }
        .btn-cancel:hover { background: rgba(255,255,255,0.15); box-shadow: 0 6px 12px rgba(0,0,0,0.3); }
        .btn-process { background: linear-gradient(135deg, #10a37f, #0b7359); color: white; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        .btn-process:hover:not(:disabled) { box-shadow: 0 6px 15px rgba(16, 163, 127, 0.4); transform: translateY(-1px); }
        .btn-process:disabled { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.3); cursor: not-allowed; box-shadow: none; }

        .progress-box { margin-top: 20px; display: none; text-align: center; color: #10a37f; font-size: 14px; font-weight: bold; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.7; } 50% { opacity: 1; text-shadow: 0 0 10px rgba(16,163,127,0.5); } 100% { opacity: 0.7; } }

        /* Right Sidebar - Glassmorphism */
        .right-sidebar { 
            position: fixed; top: 0; right: -360px; width: 360px; height: 100vh; 
            background: rgba(32, 33, 35, 0.4); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255, 255, 255, 0.05); 
            transition: right 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); 
            padding: 25px 20px; overflow-y: auto; z-index: 10; display: flex; flex-direction: column; 
            box-shadow: -10px 0 30px rgba(0,0,0,0.3);
        }
        .right-sidebar.open { right: 0; }
        .right-sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; font-weight: 600; font-size: 18px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
        .close-right-sidebar { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; width: 30px; height: 30px; color: white; cursor: pointer; font-size: 18px; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
        .close-right-sidebar:hover { background: rgba(255,74,74,0.2); color: #ff4a4a; border-color: rgba(255,74,74,0.5); }
        
        .json-card { 
            background: rgba(0,0,0,0.2); 
            padding: 18px; border-radius: 12px; margin-bottom: 15px; font-size: 13.5px; 
            border: 1px solid rgba(255,255,255,0.05); 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .json-card:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.2); border-color: rgba(255,255,255,0.1); }
        .json-card h4 { margin-bottom: 12px; font-size: 15px; background: linear-gradient(135deg, #10a37f, #33d4ac); -webkit-background-clip: text; -webkit-text-fill-color: transparent; word-break: break-all; }
        .json-line { margin-bottom: 6px; display: flex; flex-direction: column; gap: 3px; background: rgba(255,255,255,0.03); padding: 6px 10px; border-radius: 6px; }
        .json-key { font-weight: 600; color: rgba(255,255,255,0.6); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        .json-val { color: #ececf1; word-break: break-word; }

        .toggle-right-btn { 
            position: absolute; top: 20px; right: 20px; 
            background: rgba(32, 33, 35, 0.4); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1); color: white; padding: 10px 16px; border-radius: 8px; 
            cursor: pointer; z-index: 5; display: flex; align-items: center; gap: 8px; 
            transition: all 0.3s ease; box-shadow: 0 4px 10px rgba(0,0,0,0.2); font-weight: 500;
        }
        .toggle-right-btn:hover { background: rgba(255,255,255,0.1); box-shadow: 0 6px 15px rgba(0,0,0,0.3); transform: translateY(-1px); border-color: rgba(255,255,255,0.2); }
    </style>
</head>
<body>

    <div class="sidebar">
        <button class="upload-btn" id="openModalBtn">
            <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Upload Documents
        </button>
        <div class="doc-list" id="docList">
            <!-- Populated via JS -->
        </div>
    </div>

    <div class="main-chat">
        <button class="toggle-right-btn" id="toggleRightBtn">
            <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg"><polyline points="9 18 15 12 9 6"></polyline></svg>
            Show Extracted JSON
        </button>

        <div class="chat-history" id="chatArea">
            <div class="message ai">
                <div class="avatar">AI</div>
                <div class="message-content">Hello! I'm your document processing assistant. Upload some files from the sidebar, then ask me anything about them!</div>
            </div>
        </div>
        
        <div class="input-container">
            <div class="input-box">
                <input type="text" id="userInput" placeholder="Ask about 'total amounts', 'invoices', or specific people..." autocomplete="off">
                <button id="sendBtn">
                    <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" height="1.5em" width="1.5em" xmlns="http://www.w3.org/2000/svg"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Right Sidebar for JSON Output -->
    <div class="right-sidebar" id="rightSidebar">
        <div class="right-sidebar-header">
            <span>Extracted JSON Data</span>
            <button class="close-right-sidebar" id="closeRightBtn">&times;</button>
        </div>
        <div id="outputResults">
            <!-- Populated via JS -->
        </div>
    </div>

    <!-- Upload Modal -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal">
            <h2>Process New Documents</h2>
            
            <div class="drop-zone" id="dropZone">
                <p>Drag & Drop PDFs or TXT files here</p>
                <p style="margin-top: 5px; font-size: 13px; color: gray;">or <span class="browse-link" id="browseBtn">Browse files</span></p>
                <input type="file" id="fileInput" multiple accept=".pdf,.txt" style="display: none;">
            </div>

            <ul class="staged-list" id="stagedList"></ul>

            <div class="progress-box" id="progressBox">Uploading and processing... Please wait ⏳</div>

            <div class="modal-actions" id="modalActions">
                <button class="btn-cancel" id="cancelBtn">Cancel</button>
                <button class="btn-process" id="processBtn" disabled>Upload & Process</button>
            </div>
        </div>
    </div>

    <script>
        const openModalBtn = document.getElementById('openModalBtn');
        const uploadModal = document.getElementById('uploadModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const fileInput = document.getElementById('fileInput');
        const browseBtn = document.getElementById('browseBtn');
        const dropZone = document.getElementById('dropZone');
        const stagedList = document.getElementById('stagedList');
        const processBtn = document.getElementById('processBtn');
        const progressBox = document.getElementById('progressBox');
        const docList = document.getElementById('docList');
        
        const rightSidebar = document.getElementById('rightSidebar');
        const toggleRightBtn = document.getElementById('toggleRightBtn');
        const closeRightBtn = document.getElementById('closeRightBtn');
        const outputResults = document.getElementById('outputResults');
        
        let stagedFiles = [];

        // Fetch initial list of docs
        async function fetchDocs() {
            try {
                const res = await fetch('/api/documents');
                const data = await res.json();
                docList.innerHTML = '';
                data.documents.forEach(doc => {
                    const div = document.createElement('div');
                    div.className = 'doc-item';
                    div.innerText = '📄 ' + doc;
                    docList.appendChild(div);
                });
            } catch (e) {
                console.error(e);
            }
        }
        fetchDocs();

        // Right Sidebar Logic
        toggleRightBtn.addEventListener('click', () => {
            rightSidebar.classList.add('open');
            fetchOutputData();
        });

        closeRightBtn.addEventListener('click', () => {
            rightSidebar.classList.remove('open');
        });

        async function fetchOutputData() {
            try {
                const res = await fetch('/api/output');
                const data = await res.json();
                outputResults.innerHTML = '';
                
                if (Object.keys(data).length === 0) {
                    outputResults.innerHTML = '<p style="color: gray; font-size: 13px;">No extraction data available yet.</p>';
                    return;
                }

                for (const [filename, details] of Object.entries(data)) {
                    const card = document.createElement('div');
                    card.className = 'json-card';
                    
                    let fieldsHtml = '';
                    for (const [key, value] of Object.entries(details)) {
                        fieldsHtml += `<div class="json-line"><span class="json-key">${key}</span><span class="json-val">${value}</span></div>`;
                    }
                    
                    card.innerHTML = `<h4>📄 ${filename}</h4>${fieldsHtml}`;
                    outputResults.appendChild(card);
                }
            } catch (e) {
                console.error(e);
                outputResults.innerHTML = '<p style="color: #ff4a4a; font-size: 13px;">Failed to load JSON data.</p>';
            }
        }

        // Modal Logic
        openModalBtn.addEventListener('click', () => { uploadModal.style.display = 'flex'; });
        cancelBtn.addEventListener('click', () => { closeAndResetModal(); });
        
        function closeAndResetModal() {
            uploadModal.style.display = 'none';
            stagedFiles = [];
            renderStagedFiles();
            progressBox.style.display = 'none';
            document.getElementById('modalActions').style.display = 'flex';
        }

        // Drag & Drop
        browseBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        function handleFiles(files) {
            for (let i = 0; i < files.length; i++) {
                stagedFiles.push(files[i]);
            }
            renderStagedFiles();
        }

        function renderStagedFiles() {
            stagedList.innerHTML = '';
            stagedFiles.forEach((file, index) => {
                const li = document.createElement('li');
                li.className = 'staged-item';
                li.innerHTML = `
                    <span>📋 ${file.name}</span>
                    <button onclick="removeFile(${index})" title="Remove">🗑️</button>
                `;
                stagedList.appendChild(li);
            });
            processBtn.disabled = stagedFiles.length === 0;
        }

        window.removeFile = (index) => {
            stagedFiles.splice(index, 1);
            renderStagedFiles();
        };

        // Upload and Process
        processBtn.addEventListener('click', async () => {
            if(stagedFiles.length === 0) return;
            
            progressBox.style.display = 'block';
            document.getElementById('modalActions').style.display = 'none';

            const formData = new FormData();
            stagedFiles.forEach(file => {
                formData.append('files', file);
            });

            try {
                const res = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                closeAndResetModal();
                fetchDocs();
                if (rightSidebar.classList.contains('open')) {
                    fetchOutputData();
                }
                addMessage('ai', `Successfully processed ${data.processed_count} documents. The search database is updated!`);
            } catch (e) {
                console.error(e);
                alert("Upload failed. Check console.");
                closeAndResetModal();
            }
        });

        // Chat Logic
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatArea = document.getElementById('chatArea');

        function addMessage(sender, text) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            const avatar = sender === 'user' ? 'U' : 'AI';
            div.innerHTML = `
                <div class="avatar">${avatar}</div>
                <div class="message-content">${text}</div>
            `;
            chatArea.appendChild(div);
            // Scroll to bottom
            const container = document.querySelector('.main-chat');
            chatArea.scrollTop = chatArea.scrollHeight;
            window.scrollTo(0, document.body.scrollHeight);
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage('user', text);
            userInput.value = '';

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: text })
                });
                const data = await res.json();
                addMessage('ai', data.reply);
            } catch (e) {
                addMessage('ai', "Sorry, there was an error processing your query.");
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if(e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
